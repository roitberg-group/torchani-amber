name: ci

on:
  workflow_dispatch:
    inputs:
      cuda-archs:
        description: CUDA archs to build for (TORCH_CUDA_ARCH_LIST)
        default: '8.9;9.0;10.0;10.3;12.0;12.1+PTX'
  pull_request:
  push:
    branches:
      - main

env:
  TORCH_CUDA_ARCH_LIST: ${{ inputs.cuda-archs || '8.9;9.0;10.0;10.3;12.0;12.1+PTX' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Print number of processors
        run: getconf _NPROCESSORS_ONLN

      - name: Print disk space at start
        run: df -h /

      - name: Disk space after cleanup
        run: df -h /

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Create conda env
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: ci-environment.yaml
          activate-environment: ani-amber
          conda-remove-defaults: true

      - name: Install TorchANI
        run: pip install --no-deps --no-build-isolation -v -e ./submodules/torchani

      - name: Build
        run: ./run-cmake -I -T -a -x -j 4

      - name: Run tests on CPU
        env:
          TORCHANI_SKIP_CUDA_TESTS: 1
        run: ctest --test-dir build -j 4 --output-on-failure

      - name: Print disk space at end
        if: always()
        run: df -h /

concurrency:
  group: ani-amber-ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
