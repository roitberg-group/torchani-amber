# Single source of truth for the C interface (include/torchani.h) and the
# Fortran interface (interface/torchani.F90). After editing, run:
#   python interface/generate.py
# (this also runs automatically as a pre-commit / pre-push hook)
#
# Function fields:
#   name: C symbol name
#   comment: (optional) emitted above the declaration in both languages
#   fortran_wrapper: (optional) "manual" if the Fortran wrapper is hand-written
#       in templates/torchani_fortran_utils.F90. Otherwise, functions with bool or str
#       args get an auto-generated Fortran wrapper that converts logical <-> logical(c_bool)
#       and fortran strings <-> null-terminated C strings
#
# Arg fields:
#   name: argument name
#   dtype: int | double | bool | str
#   shape: (optional) C (row-major) shape, omit for scalars. If all dims except
#       the first are integer literals the C arg is typed as e.g. double x[][3],
#       otherwise as a flat pointer
#   intent: (optional) in | out | inout, default in. Scalar inputs are passed
#       by value, everything else by reference. bool and str args can't be inout.
#       A str output <name> is a C char buffer, and needs an int arg <name>_len with
#       its length. The Fortran wrapper takes the length from the Fortran string

functions:
  - name: mlip_interface_initialize
    fortran_wrapper: manual
    comment: |
      Read the config from the first &mlip namelist of the file at config_path (the
      mdin), and load the MLIP. The ML/MM options are only read if read_mlmm_config.
      If validate_amber_config too, the &qmmm namelist is also read, and the config is
      validated against it. If print_config_info, the config is printed to stdout.
      In Fortran, validate_amber_config and print_config_info are optional, default false
    args:
      - {name: num_atoms, dtype: int}
      - {name: atomic_nums, dtype: int, shape: [num_atoms]}
      - {name: config_path, dtype: str}
      - {name: read_mlmm_config, dtype: bool}
      - {name: validate_amber_config, dtype: bool}
      - {name: print_config_info, dtype: bool}

  - name: mlip_interface_calc_energy_force
    args:
      - {name: num_atoms, dtype: int}
      - {name: coords, dtype: double, shape: [num_atoms, 3]}
      - {name: cell, dtype: double, shape: [3, 3]}
      - {name: use_pbc, dtype: bool}
      - {name: molecule_idxs, dtype: int, shape: [num_atoms]}
      - {name: calc_only_bonded, dtype: bool}
      - {name: net_charge, dtype: int}
      - {name: forces, dtype: double, shape: [num_atoms, 3], intent: out}
      - {name: potential_energy, dtype: double, intent: out}

  - name: mlip_interface_calc_energy_force_from_external_neighbors
    args:
      - {name: num_atoms, dtype: int}
      - {name: num_neighbors, dtype: int}
      - {name: coords, dtype: double, shape: [num_atoms, 3]}
      - {name: neighborlist, dtype: int, shape: [2, num_neighbors]}
      - {name: shifts, dtype: double, shape: [num_neighbors, 3]}
      - {name: molecule_idxs, dtype: int, shape: [num_atoms]}
      - {name: calc_only_bonded, dtype: bool}
      - {name: net_charge, dtype: int}
      - {name: forces, dtype: double, shape: [num_atoms, 3], intent: out}
      - {name: potential_energy, dtype: double, intent: out}

  - name: mlip_interface_energy_force_atomic_charges
    args:
      - {name: num_atoms, dtype: int}
      - {name: coords, dtype: double, shape: [num_atoms, 3]}
      - {name: forces, dtype: double, shape: [num_atoms, 3], intent: out}
      - {name: atomic_charges, dtype: double, shape: [num_atoms], intent: out}
      - {name: potential_energy, dtype: double, intent: out}

  - name: mlip_interface_energy_force_atomic_charges_with_derivatives
    comment: |
      Note that atomic_charges_grad is a [num_atoms x num_atoms x 3]
      array In fortran, an array of shape [3, num_atoms, num_atoms] should be
      passed Where the element [i, j, k] is the derivative of the **charge on
      k-th atom** with respect to the **i-th position of the j-th atom**
    args:
      - {name: num_atoms, dtype: int}
      - {name: coords, dtype: double, shape: [num_atoms, 3]}
      - {name: forces, dtype: double, shape: [num_atoms, 3], intent: out}
      - {name: atomic_charges, dtype: double, shape: [num_atoms], intent: out}
      - {name: atomic_charges_grad, dtype: double, shape: [num_atoms, num_atoms, 3], intent: out}
      - {name: potential_energy, dtype: double, intent: out}

  - name: mlip_interface_energy_atomic_charges_retain
    comment: |
      This two-call API (retain + vjp) is only needed if the md engine's energy includes
      interactions of ML charges with other ML charges: direct ML-ML pairs, or ML charges
      with periodic images of ML charges (including their own images). If the ML charges
      interact only with MM charges (and their periodic images, e.g. PME with the ML
      charges left out of the grid and the real-space pair list), the potential of the MM
      charges over the ML atoms doesn't depend on the ML charges, so it can be passed in a
      single call (not currently implemented).
      For an md engine that uses the predicted charges in its own electrostatics
      (e.g. PME). mlip_interface_energy_atomic_charges_retain returns the in-vacuo energy
      and the charges (forward pass only) and keeps the graph. Then
      mlip_interface_energy_atomic_charges_vjp, given
      ml_electrostatic_potential[k] = dE_mdengine/d(charge k) (kcal/mol/e), returns
      the in-vacuo forces plus the forces due to the charges
      changing with the geometry (ml_electrostatic_potential held fixed)
        forces[j] = - d/d(coords j) [E + sum_k ml_electrostatic_potential[k] * charge k]
      with a single backward pass, and frees the graph (zero potential gives the
      in-vacuo forces).
    args:
      - {name: num_atoms, dtype: int}
      - {name: coords, dtype: double, shape: [num_atoms, 3]}
      - {name: net_charge, dtype: int}
      - {name: atomic_charges, dtype: double, shape: [num_atoms], intent: out}
      - {name: potential_energy, dtype: double, intent: out}

  - name: mlip_interface_energy_atomic_charges_vjp
    comment: |
      This two-call API (retain + vjp) is only needed if the md engine's energy includes
      interactions of ML charges with other ML charges: direct ML-ML pairs, or ML charges
      with periodic images of ML charges (including their own images). If the ML charges
      interact only with MM charges (and their periodic images, e.g. PME with the ML
      charges left out of the grid and the real-space pair list), the potential of the MM
      charges over the ML atoms doesn't depend on the ML charges, so it can be passed in a
      single call (not currently implemented).
      ml_electrostatic_potential has shape (num_atoms,), where num_atoms is the number of ML atoms
      The returned forces don't include the electrostatic force at fixed charges on the
      ML atoms, -dE_mdengine/d(coords) with the charges held fixed. The md engine must add it,
      otherwise the forces on the ML atoms are incomplete.
    args:
      - {name: num_atoms, dtype: int}
      - {name: ml_electrostatic_potential, dtype: double, shape: [num_atoms]}
      - {name: forces, dtype: double, shape: [num_atoms, 3], intent: out}

  - name: mlip_interface_calc_energy_force_qbc
    args:
      - {name: num_atoms, dtype: int}
      - {name: coords, dtype: double, shape: [num_atoms, 3]}
      - {name: net_charge, dtype: int}
      - {name: forces, dtype: double, shape: [num_atoms, 3], intent: out}
      - {name: qbc, dtype: double, intent: out}
      - {name: qbc_grad, dtype: double, shape: [num_atoms, 3], intent: out}
      - {name: potential_energy, dtype: double, intent: out}

  - name: mlip_interface_calc_data_for_monitored_mlmm
    args:
      - {name: num_atoms, dtype: int}
      - {name: coords, dtype: double, shape: [num_atoms, 3]}
      - {name: net_charge, dtype: int}
      - {name: forces, dtype: double, shape: [num_atoms, 3], intent: out}
      - {name: atomic_charges, dtype: double, shape: [num_atoms], intent: out}
      - {name: atomic_charges_grad, dtype: double, shape: [num_atoms, num_atoms, 3], intent: out}
      - {name: qbc, dtype: double, intent: out}
      - {name: qbc_grad, dtype: double, shape: [num_atoms, 3], intent: out}
      - {name: potential_energy, dtype: double, intent: out}

  - name: mlip_interface_calc_energy_force_with_coupling
    args:
      - {name: num_atoms, dtype: int}
      - {name: num_env_charges, dtype: int}
      - {name: inv_pol_dielectric, dtype: double}
      - {name: coords, dtype: double, shape: [num_atoms, 3]}
      - {name: atomic_alphas, dtype: double, shape: [num_atoms]}
      - {name: env_charge_coords, dtype: double, shape: [num_env_charges, 3]}
      - {name: env_charges, dtype: double, shape: [num_env_charges]}
      - {name: predict_charges, dtype: bool}
      - {name: use_simple_polarization_correction, dtype: bool}
      - {name: use_charge_derivatives, dtype: bool}
      - {name: ml_charge, dtype: int}
      - {name: forces_on_atoms, dtype: double, shape: [num_atoms, 3], intent: out}
      - {name: forces_on_env_charges, dtype: double, shape: [num_env_charges, 3], intent: out}
      - {name: atomic_charges, dtype: double, shape: [num_atoms], intent: inout}
      - {name: ene_pot_invacuo, dtype: double, intent: out}
      - {name: ene_pot_embed_pol, dtype: double, intent: out}
      - {name: ene_pot_embed_dist, dtype: double, intent: out}
      - {name: ene_pot_embed_coulomb, dtype: double, intent: out}
      - {name: ene_pot_total, dtype: double, intent: out}

  - name: mlip_interface_calc_energy_force_custom_mlmm
    comment: |
      Custom ML/MM model: the TorchScript model receives ML species+coords and MM
      coords+charges and computes the total energy internally. The model must export
      a 'compute_mlmm' method (see README). Forces on both regions via autograd.
      cell is ignored when use_pbc is false, and molecule_idxs is ignored when
      calc_only_bonded is false.
    args:
      - {name: num_atoms, dtype: int}
      - {name: num_env_charges, dtype: int}
      - {name: coords, dtype: double, shape: [num_atoms, 3]}
      - {name: env_charge_coords, dtype: double, shape: [num_env_charges, 3]}
      - {name: env_charges, dtype: double, shape: [num_env_charges]}
      - {name: cell, dtype: double, shape: [3, 3]}
      - {name: use_pbc, dtype: bool}
      - {name: molecule_idxs, dtype: int, shape: [num_atoms]}
      - {name: calc_only_bonded, dtype: bool}
      - {name: ml_charge, dtype: int}
      - {name: forces_on_atoms, dtype: double, shape: [num_atoms, 3], intent: out}
      - {name: forces_on_env_charges, dtype: double, shape: [num_env_charges, 3], intent: out}
      - {name: ene_pot_total, dtype: double, intent: out}

  - name: mlip_interface_get_config_int_option
    comment: |
      Get the value of an int option of the &mlip namelist, by its (case-insensitive) name.
      Exits if the option doesn't exist, or is not an int
    args:
      - {name: name, dtype: str}
      - {name: out_value, dtype: int, intent: out}

  - name: mlip_interface_get_config_bool_option
    comment: |
      Get the value of a bool option of the &mlip namelist, by its (case-insensitive) name.
      Exits if the option doesn't exist, or is not a bool
    args:
      - {name: name, dtype: str}
      - {name: out_value, dtype: bool, intent: out}

  - name: mlip_interface_get_config_float_option
    comment: |
      Get the value of a float option of the &mlip namelist, by its (case-insensitive) name.
      Exits if the option doesn't exist, or is not a float
    args:
      - {name: name, dtype: str}
      - {name: out_value, dtype: double, intent: out}

  - name: mlip_interface_get_config_str_option
    comment: |
      Get the value of a str option of the &mlip namelist, by its (case-insensitive) name.
      out_value is a buffer of length out_value_len, the value is copied null-terminated.
      Exits if the option doesn't exist, is not a str, or doesn't fit in the buffer
    args:
      - {name: name, dtype: str}
      - {name: out_value_len, dtype: int}
      - {name: out_value, dtype: str, intent: out}
